apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "wis2-ingest.fullname" . }}
  labels:
    app: {{ include "wis2-ingest.name" . }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app: {{ include "wis2-ingest.name" . }}
  template:
    metadata:
      labels:
        app: {{ include "wis2-ingest.name" . }}
    spec:
      {{- if .Values.securityContext.enabled }}
      securityContext:
        {{- if .Values.securityContext.runAsUser }}
        runAsUser: {{ .Values.securityContext.runAsUser }}
        {{- end }}
        {{- if .Values.securityContext.runAsGroup }}
        runAsGroup: {{ .Values.securityContext.runAsGroup }}
        {{- end }}
        {{- if .Values.securityContext.fsGroup }}
        fsGroup: {{ .Values.securityContext.fsGroup }}
        {{- end }}
        {{- if .Values.securityContext.supplementalGroups }}
        supplementalGroups: {{ toYaml .Values.securityContext.supplementalGroups | nindent 8 }}
        {{- end }}
      {{- end }}
      containers:
        - name: wis2-ingest
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args: ["ingestor"]
          env:
            - name: WIS2_MQTT_TOPIC
              value: "{{ .Values.env.WIS2_MQTT_TOPIC }}"
            - name: WIS2_OUTPUT_DIRECTORY
              value: "{{ .Values.env.WIS2_OUTPUT_DIRECTORY }}"
          {{- if and .Values.volume.enabled .Values.nfsMounts }}
          volumeMounts:
            {{- range $server, $paths := .Values.nfsMounts }}
              {{- range $path, $mountPaths := $paths }}
                {{- $name := printf "%s-%s" $server $path | replace "/" "-" | trunc 63 }}
                {{- range $mountPath := $mountPaths }}
            - name: {{ $name }}
              mountPath: {{ $mountPath }}
                {{- end }}
              {{- end }}
            {{- end }}
          {{- end }}
      {{- if and .Values.volume.enabled .Values.nfsMounts }}
      volumes:
        {{- range $server, $paths := .Values.nfsMounts }}
          {{- range $path, $mountPaths := $paths }}
            {{- $name := printf "%s-%s" $server $path | replace "/" "-" | trunc 63 }}
        - name: {{ $name }}
          nfs:
            server: {{ $server }}
            path: {{ $path }}
          {{- end }}
        {{- end }}
      {{- end }}