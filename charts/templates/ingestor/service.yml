{{- if .Values.ingestor.observability.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "wis2-ingest.fullname" . }}
  labels:
    {{- include "wis2-ingest.labels" . | nindent 4 }}
spec:
  selector:
    {{- include "wis2-ingest.selectorLabels" . | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.ingestor.observability.port }}
      targetPort: http
{{- end }}
