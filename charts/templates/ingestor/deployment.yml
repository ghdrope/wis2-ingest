apiVersion: apps/v1
kind: Deployment
metadata:
  # Full name of the release + chart, generated by helper
  name: {{ include "wis2-ingest.fullname" . }}
  labels:
    {{- include "wis2-ingest.labels" . | nindent 4 }}

spec:
  # Number of replicas, configurable via values.yaml
  replicas: {{ .Values.ingestor.replicaCount }}

  selector:
    matchLabels:
      # Selector must match pod template labels
      {{- include "wis2-ingest.selectorLabels" . | nindent 6 }}

  template:
    metadata:
      labels:
        {{- include "wis2-ingest.labels" . | nindent 8 }}

    spec:

      {{- if .Values.ingestor.securityContext.enabled }}
      # Pod-level security context: UID/GID, fsGroup, and supplemental groups
      securityContext:
        {{- with .Values.ingestor.securityContext.runAsUser }}
        runAsUser: {{ . | int }}
        {{- end }}
        {{- with .Values.ingestor.securityContext.runAsGroup }}
        runAsGroup: {{ . | int }}
        {{- end }}
        {{- with .Values.ingestor.securityContext.fsGroup }}
        fsGroup: {{ . | int }}
        {{- end }}
        {{- with .Values.ingestor.securityContext.supplementalGroups }}
        supplementalGroups:
{{ toYaml . | nindent 10 }}
        {{- end }}
      {{- end }}

      containers:
        - name: wis2-ingest
          # Docker image, configurable via values.yaml
          image: "{{ .Values.image.repository }}:{{ default .Chart.AppVersion .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}

          command: ["wis2-ingest"]
          args: ["ingestor"]

          env:
            # Environment variables, configurable via values.yaml
            # Optional
            - name: PORT
              value: "{{ .Values.ingestor.observability.port }}"

            - name: WIS2_MQTT_HOST
              value: '{{ .Values.ingestor.env.WIS2_MQTT_HOST | default "globalbroker.meteo.fr" }}'

            - name: WIS2_MQTT_USERNAME
              value: '{{ .Values.ingestor.env.WIS2_MQTT_USERNAME | default "everyone" }}'
            
            - name: WIS2_MQTT_PASSWORD
              value: '{{ .Values.ingestor.env.WIS2_MQTT_PASSWORD | default "everyone" }}'

            # Required
            - name: WIS2_MQTT_TOPIC
              value: {{ required "ingestor.env.WIS2_MQTT_TOPIC is required" (.Values.ingestor.env.WIS2_MQTT_TOPIC | join ";") | quote }}
            
            - name: WIS2_OUTPUT_DIRECTORY
              value: "{{ .Values.ingestor.env.WIS2_OUTPUT_DIRECTORY }}"

            - name: WIS2_AUTH_POLICIES_CONFIGMAP_PATH
              value: "/etc/wis2-ingest/auth-policies-configmap.yaml"

          ports:
            # Observability
            - name: http
              containerPort: {{ .Values.ingestor.observability.port }}

          # Resources tuning
          resources:
            {{- toYaml .Values.ingestor.resources | nindent 12 }}

          # Readiness & Liveness via HTTP endpoints
          readinessProbe:
            httpGet:
              path: /ready
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
            failureThreshold: 3

          livenessProbe:
            httpGet:
              path: /live
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 3

          {{- if .Values.ingestor.volume.enabled }}
          volumeMounts:

            {{- if .Values.ingestor.authPolicies.enabled }}
            - name: {{ include "wis2-ingest.fullname" . }}-auth-policies
              mountPath: /etc/wis2-ingest
              readOnly: true
            - name: {{ .Values.global.authPolicies.secretName }}
              mountPath: /etc/wis2-ingest/{{ .Values.global.authPolicies.secretName }}
              readOnly: true
            {{- end }}

            {{- range $server, $paths := .Values.ingestor.volume.nfsMounts }}
              {{- range $path, $mountPaths := $paths }}
                {{- $name := printf "%s-%s" $server $path | lower | replace "." "-" | replace "/" "-" | trimPrefix "-" | trimSuffix "-" | trunc 63 }}
                {{- range $mountPath := $mountPaths }}
            - name: {{ $name }}
              mountPath: {{ $mountPath }}
                  {{- end }}
                {{- end }}
              {{- end }}
          {{- end }}

      {{- if .Values.ingestor.volume.enabled }}
      # Define NFS volumes for the container
      volumes:

        {{- if .Values.ingestor.authPolicies.enabled }}
        - name: {{ include "wis2-ingest.fullname" . }}-auth-policies
          configMap:
            name: {{ include "wis2-ingest.fullname" . }}-auth-policies
        - name: {{ .Values.global.authPolicies.secretName }}
          secret:
            secretName: {{ .Values.global.authPolicies.secretName }}
        {{- end }}
        
        {{- range $server, $paths := .Values.ingestor.volume.nfsMounts }}
          {{- range $path, $mountPaths := $paths }}
            {{- $name := printf "%s-%s" $server $path | lower | replace "." "-" | replace "/" "-" | trimPrefix "-" | trimSuffix "-" | trunc 63 }}
        - name: {{ $name }}
          nfs:
            server: {{ $server }}
            path: {{ $path }}
            readOnly: false
          {{- end }}
        {{- end }}

      {{- end }}
      