apiVersion: apps/v1
kind: Deployment
metadata:
  # Full name of the release + chart, generated by helper
  name: {{ include "wis2-ingest.fullname" . }}
  labels:
    {{- include "wis2-ingest.labels" . | nindent 4 }}

spec:
  # Number of replicas, configurable via values.yaml
  replicas: {{ .Values.ingestor.replicaCount }}
  selector:
    matchLabels:
      # Selector must match pod template labels
      {{- include "wis2-ingest.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "wis2-ingest.labels" . | nindent 8 }}
    spec:
      {{- if .Values.ingestor.securityContext.enabled }}
      # Pod-level security context: UID/GID, fsGroup, and supplemental groups
      securityContext:
        {{- if .Values.ingestor.securityContext.runAsUser }}
        runAsUser: {{ .Values.ingestor.securityContext.runAsUser }}
        {{- end }}
        {{- if .Values.ingestor.securityContext.runAsGroup }}
        runAsGroup: {{ .Values.ingestor.securityContext.runAsGroup }}
        {{- end }}
        {{- if .Values.ingestor.securityContext.fsGroup }}
        fsGroup: {{ .Values.ingestor.securityContext.fsGroup }}
        {{- end }}
        {{- if .Values.ingestor.securityContext.supplementalGroups }}
        supplementalGroups: {{ toYaml .Values.ingestor.securityContext.supplementalGroups | nindent 8 }}
        {{- end }}
      {{- end }}

      containers:
        - name: wis2-ingest
          # Docker image, configurable via values.yaml
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args: ["ingestor"]
          env:
            # Environment variables, configurable via values.yaml
            - name: WIS2_MQTT_TOPIC
              value: "{{ .Values.ingestor.env.WIS2_MQTT_TOPIC }}"
            - name: WIS2_OUTPUT_DIRECTORY
              value: "{{ .Values.ingestor.env.WIS2_OUTPUT_DIRECTORY }}"

          # Readiness & Liveness via HTTP endpoints
          readinessProbe:
            httpGet:
              path: /ready
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 5
            failureThreshold: 3

          livenessProbe:
            httpGet:
              path: /live
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 3

          {{- if and .Values.ingestor.volume.enabled .Values.ingestor.nfsMounts }}
          # Mount NFS volumes if enabled
          volumeMounts:
            {{- range $server, $paths := .Values.ingestor.nfsMounts }}
              {{- range $path, $mountPaths := $paths }}
                {{- $name := printf "%s-%s" $server $path | lower | replace "." "-" | replace "/" "-" | trimPrefix "-" | trimSuffix "-" | trunc 63 }}
                {{- range $mountPath := $mountPaths }}
          - name: {{ $name }}
            mountPath: {{ $mountPath }}
                {{- end }}
              {{- end }}
            {{- end }}
          {{- end }}

      {{- if and .Values.ingestor.volume.enabled .Values.ingestor.nfsMounts }}
      # Define NFS volumes for the container
      volumes:
        {{- range $server, $paths := .Values.ingestor.nfsMounts }}
          {{- range $path, $mountPaths := $paths }}
            {{- $name := printf "%s-%s" $server $path | lower | replace "." "-" | replace "/" "-" | trimPrefix "-" | trimSuffix "-" | trunc 63 }}
      - name: {{ $name }}
        nfs:
          server: {{ $server }}
          path: {{ $path }}
          readOnly: false
          {{- end }}
        {{- end }}
      {{- end }}
      